<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboards</title>
<style>
  :root { --bg:#f4f1ea; --fg:#14181d; --card:#ffffff; --line:#ddd8cc; --accent:#e8590c; --muted:#5b6168; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1419; --fg:#f4f1ea; --card:#1b222b; --line:#2c3541; --muted:#c9c4b8; } }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg); font-family:'Helvetica Neue', Arial, sans-serif; }
  h1 { margin:0 0 4px; font-size:24px; }
  p.sub { margin:0 0 16px; color:var(--muted); }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  input, button { padding:8px 10px; font-size:14px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.alt { background:var(--card); color:var(--fg); border-color:var(--line); }
  button:disabled { opacity:0.6; cursor:wait; }
  #status { margin:8px 0 16px; color:var(--muted); font-size:14px; }
  pre#script-out { margin:0; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:8px; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; white-space:pre-wrap; min-height:240px; max-height:70vh; overflow:auto; }
</style>
</head>
<body>
<h1>Scoreboards</h1>
<p class="sub">Run the demo scripts and read their output here</p>
<div class="bar">
  <input id="u" value="alice" aria-label="username">
  <input id="p" type="password" value="Password1!" aria-label="password">
  <button id="login">Log in</button>
</div>
<div class="bar">
  <button id="run-tests" class="alt">Run tests</button>
  <button id="run-security" class="alt">Security check</button>
  <button id="run-bench" class="alt">Bench</button>
</div>
<div id="status">Not logged in.</div>
<pre id="script-out"></pre>
<script>
let token = null;
const $ = (id) => document.getElementById(id);
const setStatus = (m) => { $('status').textContent = m; };

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, Object.assign({}, opts, { headers }));
}

$('login').onclick = async () => {
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username: $('u').value, password: $('p').value }) });
  if (!r.ok) { setStatus('Login failed.'); return; }
  token = (await r.json()).token;
  setStatus('Logged in as ' + $('u').value + '.');
};

const scriptButtons = ['run-tests', 'run-security', 'run-bench'];
function setScriptsBusy(busy) {
  scriptButtons.forEach((id) => { $(id).disabled = busy; });
}

async function runScript(path, label) {
  if (!token) { setStatus('Log in first.'); return; }
  setScriptsBusy(true);
  setStatus('Running ' + label + '...');
  $('script-out').textContent = '';
  try {
    const r = await api(path, { method: 'POST' });
    let body = null;
    try { body = await r.json(); } catch (e) { body = null; }
    if (!r.ok) {
      setStatus(label + ' failed (HTTP ' + r.status + ').');
      $('script-out').textContent = (body && body.error) ? body.error : 'Request failed.';
      return;
    }
    const extra = body.timedOut ? ', timed out' : '';
    setStatus(label + ' finished (exit ' + body.exitCode + extra + ').');
    $('script-out').textContent = body.output && body.output.length ? body.output : '(no output)';
  } catch (e) {
    setStatus(label + ' failed.');
    $('script-out').textContent = 'Could not reach the server.';
  } finally {
    setScriptsBusy(false);
  }
}

$('run-tests').onclick = () => runScript('/api/demo/tests', 'Tests');
$('run-security').onclick = () => runScript('/api/demo/security-check', 'Security check');
$('run-bench').onclick = () => runScript('/api/demo/bench', 'Bench');
</script>
</body>
</html>
